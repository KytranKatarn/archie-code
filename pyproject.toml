[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archie-engine"
version = "0.1.0"
description = "ARCHIE Code CLI — Python engine daemon"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    # RUNTIME, not a test tool: the #5003 fix-efficacy gate re-asserts pyflakes findings
    # (F401/F841/F821/...) against the post-edit file during every autonomous build, and the
    # #5004 stale-skip uses the same checker at pick time. Without it those findings return
    # UNVERIFIED — 1327 of 2230 open issues, measured 2026-07-20.
    "pyflakes>=3.1",
    "requests>=2.31",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/KytranKatarn/archie-code"
Repository = "https://github.com/KytranKatarn/archie-code"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.4"  # <1.4: 1.4.0 stopped implicitly creating an event loop, so 10 tests in test_platform_skills.py raise "no current event loop". Unpinned, a clean install silently gets a broken suite while a dev box with 1.3.0 stays green. Real fix = stop relying on the implicit loop (task #6028).,
]

[project.scripts]
archie-engine = "archie_engine.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
